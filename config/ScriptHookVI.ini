; ScriptHookVI configuration. Place next to ScriptHookVI.dll.
; ';' or '#' start a comment.

[General]
Enabled=1
; Only attach when the game executable has this exact file name (empty = any).
TargetExe=
; How long to wait for the game window before giving up on keyboard input.
WindowTimeoutMs=60000

[Asi]
Load=1
; Folders (relative to the game folder, space separated) searched for *.asi
Directories=. plugins

[Safety]
; Single-player tool. Scripts are paused while the game reports an online
; session (needs the OnlineFlag pattern below). Do not switch this on to use
; mods online.
AllowOnline=0
; Refuse to attach at all while OnlineFlag cannot be resolved.
RequireOnlineGuard=1

; ---------------------------------------------------------------------------
; Patterns. NONE are shipped: no pattern has been verified for GTA VI.
; Fill them in for the exact executable build (see getGameExeTimestamp in the
; log). Keys per target <Name>:
;   <Name>.Pattern   IDA-style bytes, "?? " wildcards
;   <Name>.Offset    added to the match address (default 0)
;   <Name>.RipDisp   offset of the rel32 inside the matched instruction
;   <Name>.RipLen    full instruction length (0 = do not resolve RIP-relative)
;   <Name>.Deref     1 = read a pointer at the resolved address
;   <Name>.Stolen    hooks only: bytes to steal (>= 14, instruction boundary,
;                    position-independent code only)
;
; Targets:
;   ScriptTick        function called once per frame on the game's script thread
;                     (hooked; <= 4 integer args)            -> needs Stolen
;   GetNativeHandler  fn(uint64 hash) -> handler(NativeContext*)
;   GlobalBase        address of the script-globals page table
;   OnlineFlag        byte that is non-zero during an online session
; ---------------------------------------------------------------------------
[Patterns]
; ScriptTick.Pattern=48 89 5C 24 ?? 57 48 83 EC 20 ...
; ScriptTick.Stolen=15
; GetNativeHandler.Pattern=
; GlobalBase.Pattern=
; GlobalBase.RipDisp=3
; GlobalBase.RipLen=7
; OnlineFlag.Pattern=
